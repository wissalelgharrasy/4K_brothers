<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 10 460 252" width="100%" height="100%" fill="none">
  <defs>
    <!-- Strong dark drop shadow matching the automotive badge look -->
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    
    <!-- Rich racing red gradient -->
    <linearGradient id="racingRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1E1E"/>
      <stop offset="50%" stop-color="#E51A1A"/>
      <stop offset="100%" stop-color="#C50808"/>
    </linearGradient>

    <!-- Subtle car roofline gradient -->
    <linearGradient id="carWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- 1. Top Car Aerodynamic Silhouette -->
  <g filter="url(#badgeShadow)">
    <!-- Main roofline arc -->
    <path d="M 68,66 C 125,56 185,16 250,16 C 315,16 375,56 432,66 C 385,46 320,24 250,24 C 180,24 115,46 68,66 Z" 
          fill="url(#carWhite)" 
          stroke="#000000" 
          stroke-width="1.2" />
    
    <!-- Windshield / A-pillar accent curve -->
    <path d="M 108,62 C 145,52 185,40 228,36 C 190,42 150,53 108,62 Z" 
          fill="#FFFFFF" 
          opacity="0.95" />
  </g>

  <!-- 2. "4K" Emblem (Italicized Automotive Racing Geometry) -->
  <g transform="skewX(-14) translate(30, 0)" filter="url(#badgeShadow)">
    
    <!-- "4" - Solid Racing Red with Hollow Triangle -->
    <path d="M 182,68 L 222,68 L 222,142 L 252,142 L 252,166 L 222,166 L 222,192 L 182,192 L 182,166 L 108,166 L 108,142 L 182,68 Z M 150,142 L 182,142 L 182,110 L 150,142 Z" 
          fill="url(#racingRed)" 
          stroke="#000000" 
          stroke-width="4.5" 
          stroke-linejoin="miter" 
          paint-order="stroke fill" />

    <!-- "K" - Red Portion (Stem & Upper Diagonal Arm) -->
    <path d="M 242,68 L 282,68 L 282,112 L 334,68 L 388,68 L 322,125 L 298,125 L 282,138 L 282,192 L 242,192 Z" 
          fill="url(#racingRed)" 
          stroke="#000000" 
          stroke-width="4.5" 
          stroke-linejoin="miter" 
          paint-order="stroke fill" />

    <!-- "K" - White Lower Diagonal Leg (The signature diagonal two-tone cut) -->
    <path d="M 298,125 L 340,90 L 398,192 L 346,192 L 298,125 Z" 
          fill="#FFFFFF" 
          stroke="#000000" 
          stroke-width="4.5" 
          stroke-linejoin="miter" 
          paint-order="stroke fill" />
  </g>

  <!-- 3. "BROTHERS" - Heavy Block Sans Typography -->
  <text x="250" y="222" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Arial Black', Impact, sans-serif" 
        font-weight="900" 
        font-size="58" 
        fill="#FFFFFF" 
        stroke="#000000" 
        stroke-width="5" 
        paint-order="stroke fill" 
        letter-spacing="4" 
        filter="url(#badgeShadow)">BROTHERS</text>

  <!-- 4. Subtitle: "— VOTRE PARTENAIRE AUTO —" -->
  <g filter="url(#badgeShadow)">
    <!-- Left red pill bar -->
    <rect x="36" y="246" width="46" height="8" rx="4" fill="#E51A1A" stroke="#000000" stroke-width="1.2" />
    
    <!-- Slogan text -->
    <text x="250" y="254" 
          text-anchor="middle" 
          font-family="'Montserrat', Arial, sans-serif" 
          font-weight="900" 
          font-size="16.5" 
          fill="#FFFFFF" 
          stroke="#000000" 
          stroke-width="2.2" 
          paint-order="stroke fill" 
          letter-spacing="3.5">VOTRE PARTENAIRE AUTO</text>
    
    <!-- Right red pill bar -->
    <rect x="418" y="246" width="46" height="8" rx="4" fill="#E51A1A" stroke="#000000" stroke-width="1.2" />
  </g>
</svg>
