<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A2A"/>
      <stop offset="60%" stop-color="#E51A1A"/>
      <stop offset="100%" stop-color="#B80E0E"/>
    </linearGradient>
    <filter id="carGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E51A1A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Car outline silhouette on top -->
  <path d="M 90,52 C 140,48 185,15 250,15 C 315,15 360,48 410,52 C 370,36 320,24 250,24 C 180,24 130,36 90,52 Z" fill="#E2E8F0" />
  <path d="M 120,44 C 165,30 205,25 250,25 C 295,25 335,30 380,44 C 340,36 300,32 250,32 C 200,32 160,36 120,44 Z" fill="#FFFFFF" />

  <!-- 4K Big Letters -->
  <g font-family="system-ui, -apple-system, 'Impact', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-style="italic">
    <!-- 4 -->
    <text x="145" y="115" font-size="95" fill="url(#redGrad)" text-anchor="middle" filter="url(#carGlow)">4</text>
    <!-- K -->
    <text x="290" y="115" font-size="95" fill="url(#redGrad)" text-anchor="middle" filter="url(#carGlow)">K</text>
    <!-- Accent split on K -->
    <path d="M 245,35 L 295,115 L 265,115 L 225,50 Z" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- BROTHERS in Bold White/Dark -->
  <text x="250" y="160" font-family="system-ui, -apple-system, 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    BROTHERS
  </text>

  <!-- Subtitle line: VOTRE PARTENAIRE AUTO -->
  <g transform="translate(0, 175)">
    <!-- Left red line -->
    <rect x="55" y="10" width="35" height="5" rx="2.5" fill="#E51A1A" />
    <text x="250" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#F1F5F9" text-anchor="middle" letter-spacing="3">
      VOTRE PARTENAIRE AUTO
    </text>
    <!-- Right red line -->
    <rect x="410" y="10" width="35" height="5" rx="2.5" fill="#E51A1A" />
  </g>
</svg>
